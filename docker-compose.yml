# Local development only.
# POSTGRES_HOST_AUTH_METHOD=trust disables password checks for TCP connections.
# It is needed because the Bend client cannot do SCRAM authentication yet.
# Do not use this configuration anywhere the port is reachable from untrusted networks.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local development only. No auth; do not expose 6379 beyond localhost.
  redis:
    image: redis:7
    # Cache only: no persistence, so a restart starts empty and cannot serve stale snapshots.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
